# =============================================================================
# TEST: Purchase Flow - NYC Icons Express (Happy Path)
# =============================================================================
# Purpose: Validate the full purchase flow from package selection through
#          to a paid (free-via-promo) order on the Success screen.
# Coverage: the assignment's 6 scenario steps (Navigate & select the
#          package / Ticket quantity / Date & time selection / Questions
#          page / Checkout page / Success page), each as its own top-level
#          section below.
# Tags: purchase
# =============================================================================

appId: com.ventrata.maestro_booking_demo
tags:
  - purchase
---
- runScript: variables.js

# Flow 1: Launch the app and select the NYC Icons Express package
- runFlow:
    label: '1. Navigate & select the package'
    commands:
      - runFlow:
          file: subflows/navigate_home_to_tickets.yaml

# Flow 2: Verify child-requires-adult, then select 2 adults + 1 child
- runFlow:
    label: '2. Ticket quantity'
    commands:
      # A lone child ticket requires an adult
      - tapOn:
          id: ${output.ids.tickets.childPlus}
      - assertVisible:
          id: ${output.ids.tickets.childRequiresAdultError}
      - tapOn:
          id: ${output.ids.tickets.continueButton}
      - assertVisible:
          id: ${output.ids.tickets.page}
      - tapOn:
          id: ${output.ids.tickets.childMinus}
      - assertNotVisible:
          id: ${output.ids.tickets.childRequiresAdultError}

      # Select 2 adults + 1 child = 82.50 (incl. 10% booking fee)
      - tapOn:
          id: ${output.ids.tickets.adultPlus}
      - tapOn:
          id: ${output.ids.tickets.adultPlus}
      - tapOn:
          id: ${output.ids.tickets.childPlus}
      - tapOn:
          id: ${output.ids.tickets.continueButton}

# Flow 3: Product 1 locked until product 0 confirmed, then dates/times confirmed, Reset verified to actually clear (and re-lock)
- runFlow:
    label: '3. Date & time selection'
    commands:
      - extendedWaitUntil:
          visible:
            id: ${output.ids.dateTime.page}
          timeout: ${output.timeouts.screenTransition}
      # Force timeslots open regardless of wall clock (see README)
      - tapOn:
          id: ${output.ids.debug.setForceOpenButton}

      # Only product 0 has a date picker initially — product 1 is locked
      # (tapping it does nothing) until product 0 is confirmed
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.productSelectButton(1)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.dateTime.productSelectButton(1)}
      - assertNotVisible:
          id: ${output.ids.timeslot.dialog}
      - assertNotVisible:
          id: ${output.ids.dateTime.productConfirmedDate(1)}

      # Confirming product 0 unlocks the rest
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.productSelectButton(0)}
          direction: UP
      - tapOn:
          id: ${output.ids.dateTime.productSelectButton(0)}
      - assertVisible:
          id: ${output.ids.calendar.dialog}
      - tapOn:
          id: ${output.ids.calendar.saveButton}
      - assertVisible:
          id: ${output.ids.dateTime.productConfirmedDate(0)}

      # Pick date/time for product 1 (Madame Tussauds)
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.productSelectButton(1)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.dateTime.productSelectButton(1)}
      - tapOn:
          id: ${output.ids.timeslot.slot("11:00")}
      - tapOn:
          id: ${output.ids.timeslot.saveButton}
      - assertVisible:
          id: ${output.ids.dateTime.productConfirmedDate(1)}

      # Reset selection actually clears the confirmed products
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.resetSelectionLink}
          direction: UP
      - tapOn:
          id: ${output.ids.dateTime.resetSelectionLink}
      - assertNotVisible:
          id: ${output.ids.dateTime.productConfirmedDate(0)}
      - assertNotVisible:
          id: ${output.ids.dateTime.productConfirmedDate(1)}
      - assertNotVisible:
          id: ${output.ids.dateTime.resetSelectionLink}

      # Reset also re-locks product 1, not just clearing its confirmed date
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.productSelectButton(1)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.dateTime.productSelectButton(1)}
      - assertNotVisible:
          id: ${output.ids.timeslot.dialog}
      - assertNotVisible:
          id: ${output.ids.dateTime.productConfirmedDate(1)}

      # Confirm all mandatory products (0, 1, 3) so Continue is enabled
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.productSelectButton(0)}
          direction: UP
      - tapOn:
          id: ${output.ids.dateTime.productSelectButton(0)}
      - assertVisible:
          id: ${output.ids.calendar.dialog}
      - tapOn:
          id: ${output.ids.calendar.saveButton}
      - assertVisible:
          id: ${output.ids.dateTime.productConfirmedDate(0)}
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.productSelectButton(1)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.dateTime.productSelectButton(1)}
      - tapOn:
          id: ${output.ids.timeslot.slot("11:00")}
      - tapOn:
          id: ${output.ids.timeslot.saveButton}
      - assertVisible:
          id: ${output.ids.dateTime.productConfirmedDate(1)}
      - scrollUntilVisible:
          element:
            id: ${output.ids.dateTime.productSelectButton(3)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.dateTime.productSelectButton(3)}
      - assertVisible:
          id: ${output.ids.dateTime.productConfirmedDate(3)}
      - tapOn:
          id: ${output.ids.dateTime.continueButton}

# Flow 4: Validation error on empty Questions form, then fill only the required fields
- runFlow:
    label: '4. Questions page'
    commands:
      - extendedWaitUntil:
          visible:
            id: ${output.ids.questions.page}
          timeout: ${output.timeouts.screenTransition}

      # Empty form is blocked with a validation error
      - tapOn:
          id: ${output.ids.questions.continueButton}
      - assertVisible:
          id: ${output.ids.questions.validationError}
      - assertVisible:
          id: ${output.ids.questions.page}

      # Fill only the required fields: text area, "how did you hear about
      # us", and one "I confirm" checkbox per ticket (2 adults + 1 child).
      - tapOn:
          id: ${output.ids.questions.bookingTextArea}
      - inputText: "By subway."
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: ${output.ids.questions.bookingSelect}
          direction: DOWN
      - tapOn:
          id: ${output.ids.questions.bookingSelect}
      - tapOn:
          text: ${output.texts.friendOrFamilyOption}
      - scrollUntilVisible:
          element:
            id: ${output.ids.questions.perTicketConfirmCheckbox(0)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.questions.perTicketConfirmCheckbox(0)}
      - scrollUntilVisible:
          element:
            id: ${output.ids.questions.perTicketConfirmCheckbox(1)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.questions.perTicketConfirmCheckbox(1)}
      - scrollUntilVisible:
          element:
            id: ${output.ids.questions.perTicketConfirmCheckbox(2)}
          direction: DOWN
      - tapOn:
          id: ${output.ids.questions.perTicketConfirmCheckbox(2)}
      - tapOn:
          id: ${output.ids.questions.continueButton}

# Flow 5: Note price, redeem promo (only way to reach Success - see README),
# confirm order. Redeeming: "Enter promo" itself just shows a fake error —
# go back to the Questions page, enter MAESTROFREE there, then come
# forward again to Checkout, now discounted to free.
- runFlow:
    label: '5. Checkout page - Finalizing the order'
    commands:
      - extendedWaitUntil:
          visible:
            id: ${output.ids.checkout.page}
          timeout: ${output.timeouts.screenTransition}
      - scrollUntilVisible:
          element:
            id: ${output.ids.checkout.priceTotal}
          direction: DOWN
      - assertVisible:
          id: ${output.ids.checkout.priceTotal}
          text: ${output.prices.twoAdultsOneChild}

      # The promo field doesn't exist on Questions until this exact
      # sequence unlocks it: tap "enter promo" here (shows a fake "Error."
      # and goes nowhere), then go back — see FINDINGS.md.
      - scrollUntilVisible:
          element:
            id: ${output.ids.checkout.enterPromoButton}
          direction: DOWN
      - tapOn:
          id: ${output.ids.checkout.enterPromoButton}
      - back
      - assertVisible:
          id: ${output.ids.questions.page}
      - scrollUntilVisible:
          element:
            id: ${output.ids.questions.promoCodeField}
          direction: DOWN
      - tapOn:
          id: ${output.ids.questions.promoCodeField}
      - inputText: "MAESTROFREE"
      - hideKeyboard
      - tapOn:
          id: ${output.ids.questions.continueButton}
      - extendedWaitUntil:
          visible:
            id: ${output.ids.checkout.page}
          timeout: ${output.timeouts.screenTransition}
      - scrollUntilVisible:
          element:
            id: ${output.ids.checkout.promoAppliedChip}
          direction: DOWN
      - assertVisible:
          id: ${output.ids.checkout.promoAppliedChip}

      # Fill contact details and confirm. Total is 0.00 after the promo
      # code, so this skips the card Payment screen entirely and goes
      # straight to Success — no card payment involved.
      - scrollUntilVisible:
          element:
            id: ${output.ids.checkout.firstNameField}
          direction: UP
      - tapOn:
          id: ${output.ids.checkout.firstNameField}
      - inputText: "Jan"
      - tapOn:
          id: ${output.ids.checkout.lastNameField}
      - inputText: "Novak"
      - tapOn:
          id: ${output.ids.checkout.cityField}
      - inputText: "Prague"
      - hideKeyboard
      - tapOn:
          id: ${output.ids.checkout.countryField}
      - tapOn:
          id: ${output.ids.checkout.countryOption("cz")}
      - tapOn:
          id: ${output.ids.checkout.stateProvinceField}
      - inputText: "Prague"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: ${output.ids.checkout.bookingTermsCheckbox}
          direction: DOWN
      - tapOn:
          id: ${output.ids.checkout.bookingTermsCheckbox}
      - tapOn:
          id: ${output.ids.checkout.cancellationTermsCheckbox}
      - tapOn:
          id: ${output.ids.checkout.payOrConfirmButton}

# Flow 6: Verify order summary and pricing on the Success screen
- runFlow:
    label: '6. Success page'
    commands:
      - extendedWaitUntil:
          visible:
            id: ${output.ids.success.page}
          timeout: ${output.timeouts.screenTransition}

      # Verify the order summary and pricing
      - assertVisible:
          id: ${output.ids.success.freeBadge}
      - assertVisible:
          id: ${output.ids.success.unitTypeRow("adult")}
      - assertVisible:
          id: ${output.ids.success.unitTypeRow("child")}
      - assertVisible:
          id: ${output.ids.success.productSummary(0)}
      - assertVisible:
          id: ${output.ids.success.dateField(0)}
      - assertVisible:
          id: ${output.ids.success.productSummary(1)}
      - assertVisible:
          id: ${output.ids.success.dateField(1)}
      - assertVisible:
          id: ${output.ids.success.timeField(1)}
      - scrollUntilVisible:
          element:
            id: ${output.ids.success.productSummary(3)}
          direction: DOWN
      - assertVisible:
          id: ${output.ids.success.productSummary(3)}
      - assertVisible:
          id: ${output.ids.success.dateField(3)}
      - assertNotVisible:
          id: ${output.ids.success.productSummary(2)}
      - scrollUntilVisible:
          element:
            id: ${output.ids.success.originalPriceRow}
          direction: DOWN
      - assertVisible:
          id: ${output.ids.success.originalPriceRow}
          text: ${output.prices.twoAdultsOneChild}
      - assertVisible:
          id: ${output.ids.success.discountRow}
      - assertVisible:
          id: ${output.ids.success.finalTotal}
          text: ${output.prices.free}

      - scrollUntilVisible:
          element:
            id: ${output.ids.success.primaryActionButton}
          direction: DOWN
      - tapOn:
          id: ${output.ids.success.primaryActionButton}
      - assertVisible:
          id: ${output.ids.home.page}
